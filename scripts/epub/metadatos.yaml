description: |
  El 30 de julio de 2026 entran en Ceuta setenta y dos mil personas. Entre los
  cuerpos que salen del agua hay un chico de catorce años que no murió ahogado,
  y en su bolsillo, plastificado, un informe forense de 2017 firmado por la
  médica que lo levanta: el papel con el que declaró adulto a un menor.
